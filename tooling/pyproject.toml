[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thscript"
version = "0.1.0"
description = "Reliable text, corpus, statistics and document tooling for theological research"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Hagen Schilder"}]

[tool.setuptools.packages.find]
include = ["thscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
